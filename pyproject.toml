[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chemicheck119-speech"
version = "0.1.0"
description = "Speech recognition boundary for ChemiCheck119"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper==1.2.1",
  "google-cloud-storage==3.3.1",
]

[project.optional-dependencies]
lora = [
  "accelerate==1.14.0",
  "ctranslate2==4.8.2",
  "numpy==2.3.5",
  "peft==0.20.0",
  "scipy==1.16.3",
  "transformers==4.57.6",
]

[project.scripts]
chemicheck119-speech-eval = "chemicheck119_speech.cli:main"
chemicheck119-speech-robustness-eval = "chemicheck119_speech.robustness:main"
chemicheck119-speech-cross-region-report = "chemicheck119_speech.cross_region_report:main"
chemicheck119-speech-capture-runtime-provenance = "chemicheck119_speech.runtime_provenance:main"
chemicheck119-speech-failure-analysis = "chemicheck119_speech.failure_analysis:main"
chemicheck119-speech-capture-radio-sim-provenance = "chemicheck119_speech.radio_sim_provenance:main"
chemicheck119-speech-lora-preflight = "chemicheck119_speech.lora_protocol:main"
chemicheck119-speech-lora-data-preflight = "chemicheck119_speech.lora_data_preflight:main"
chemicheck119-speech-lora-tokenizer-preflight = "chemicheck119_speech.lora_tokenizer_preflight:main"
chemicheck119-speech-lora-train = "chemicheck119_speech.lora_training:main"
chemicheck119-speech-lora-numeric-smoke = "chemicheck119_speech.lora_numeric_smoke:main"
chemicheck119-speech-lora-convert = "chemicheck119_speech.lora_conversion:main"
chemicheck119-speech-lora-abc-report = "chemicheck119_speech.lora_abc_report:main"
chemicheck119-speech-lora-dev-eval = "chemicheck119_speech.lora_dev_evaluation:main"
chemicheck119-speech-lora-wind-report = "chemicheck119_speech.lora_wind_report:main"

[tool.setuptools.packages.find]
where = ["src"]
