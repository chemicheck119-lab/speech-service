[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chemicheck119-speech"
version = "0.1.0"
description = "Speech recognition boundary for ChemiCheck119"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper==1.2.1",
  "google-cloud-storage==3.3.1",
]

[project.scripts]
chemicheck119-speech-eval = "chemicheck119_speech.cli:main"
chemicheck119-speech-robustness-eval = "chemicheck119_speech.robustness:main"
chemicheck119-speech-cross-region-report = "chemicheck119_speech.cross_region_report:main"
chemicheck119-speech-capture-runtime-provenance = "chemicheck119_speech.runtime_provenance:main"
chemicheck119-speech-failure-analysis = "chemicheck119_speech.failure_analysis:main"
chemicheck119-speech-capture-radio-sim-provenance = "chemicheck119_speech.radio_sim_provenance:main"
chemicheck119-speech-lora-preflight = "chemicheck119_speech.lora_protocol:main"
chemicheck119-speech-lora-data-preflight = "chemicheck119_speech.lora_data_preflight:main"

[tool.setuptools.packages.find]
where = ["src"]
