name: Speech Service CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: test-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: API 테스트 의존성 설치
        run: python -m pip install --disable-pip-version-check "fastapi==0.139.2" "httpx==0.28.1" "starlette==1.3.1" "uvicorn==0.51.0"
      - run: python -m compileall -q src tests scripts
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Speech OpenAPI 계약 검사
        run: PYTHONPATH=src python scripts/export_speech_openapi.py --check
